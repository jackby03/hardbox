name: Quality Gates
permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  # No 'branches' filter on purpose. Restricting pull_request to base=main
  # silently skipped CI for stacked PRs (base = another feature branch), and
  # retargeting the base does not fire an 'edited' event to start it later, so
  # branch protection sat on "waiting for status to be reported" forever.
  #
  # 'labeled' and 'ready_for_review' are listed explicitly because they are not
  # default types: without them, adding the 'full-ci' label would not start the
  # distro-parity matrix it is supposed to gate.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  # Lets a maintainer re-run the suite on the current commit without pushing.
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  hardbox-audit:
    name: Self-Audit
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build hardbox
        run: go build -o hardbox ./cmd/hardbox

      - name: Run audit (dry run, non-interactive)
        run: |
          ./hardbox audit --profile cis-level1 --format json --output audit-report.json || true

      - name: Validate audit report JSON structure
        run: |
          jq -e '
            has("session_id") and
            has("timestamp") and
            has("profile") and
            has("overall_score") and
            (.modules | type == "array" and length > 0) and
            all(.modules[]; has("name") and has("score") and has("findings") and (.findings | type == "array")) and
            all(.modules[].findings[]?; has("check_id") and has("title") and has("status") and has("severity"))
          ' audit-report.json > /dev/null

      - name: Assert audit returned findings
        run: |
          jq -e '[.modules[].findings[]] | length > 0' audit-report.json > /dev/null

      - name: Assert audit score is non-zero
        run: |
          jq -e '.overall_score > 0' audit-report.json > /dev/null

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json

  markdown-links:
    name: Documentation Links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check internal file links in README.md
        run: |
          FAILED=0
          LINKS=$(grep -oP '\]\(\K[^)]+' README.md | grep -v '^https\?://' | grep -v '^#')
          for link in $LINKS; do
            filepath="${link%%#*}"
            [ -z "$filepath" ] && continue
            if [ ! -e "$filepath" ]; then
              echo "::error file=README.md::Broken link — '$filepath' does not exist"
              FAILED=1
            else
              echo "✓ $filepath"
            fi
          done
          exit $FAILED

      - name: Check internal file links in CONTRIBUTING.md
        run: |
          FAILED=0
          LINKS=$(grep -oP '\]\(\K[^)]+' CONTRIBUTING.md | grep -v '^https\?://' | grep -v '^#')
          for link in $LINKS; do
            filepath="${link%%#*}"
            [ -z "$filepath" ] && continue
            if [ ! -e "$filepath" ]; then
              echo "::error file=CONTRIBUTING.md::Broken link — '$filepath' does not exist"
              FAILED=1
            else
              echo "✓ $filepath"
            fi
          done
          exit $FAILED

  profile-consistency:
    name: Profile Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Collect shipped profile names
        id: shipped
        run: |
          PROFILES=$(ls configs/profiles/*.yaml 2>/dev/null \
            | xargs -I{} basename {} .yaml \
            | sort \
            | tr '\n' ' ')
          echo "list=${PROFILES}" >> "$GITHUB_OUTPUT"
          echo "Shipped profiles: ${PROFILES}"

      - name: Assert every shipped profile appears in README
        run: |
          FAILED=0
          for profile in ${{ steps.shipped.outputs.list }}; do
            if ! grep -q "\`${profile}\`" README.md; then
              echo "::error file=README.md::Shipped profile '${profile}' is not documented in README.md"
              FAILED=1
            else
              echo "✓ ${profile} found in README.md"
            fi
          done
          exit $FAILED

      - name: Assert every shipped profile appears in COMPLIANCE.md
        run: |
          FAILED=0
          for profile in ${{ steps.shipped.outputs.list }}; do
            if ! grep -q "\`${profile}\`" docs/COMPLIANCE.md; then
              echo "::error file=docs/COMPLIANCE.md::Shipped profile '${profile}' is not documented in docs/COMPLIANCE.md"
              FAILED=1
            else
              echo "✓ ${profile} found in COMPLIANCE.md"
            fi
          done
          exit $FAILED

      - name: Warn about profiles listed in README that are not yet shipped
        run: |
          DOCS_PROFILES=$(grep -oP '`[a-z][a-z0-9-]+`' README.md \
            | tr -d '`' \
            | grep -v '^hardbox$\|^cis$\|^json$\|^text$\|^markdown$\|^html$' \
            | sort -u)

          for doc_profile in ${DOCS_PROFILES}; do
            if [ ! -f "configs/profiles/${doc_profile}.yaml" ]; then
              echo "::notice file=README.md::Profile '${doc_profile}' is documented in README but not yet shipped (roadmap item)"
            fi
          done

  # ── Documentation coverage ─────────────────────────────────────────────────
  # Two invariants, both of which had drifted: every registered module must have
  # a section in MODULES.md, and every implemented check must be mapped in
  # COMPLIANCE.md. Six modules and sixty-three checks were shipped without either
  # before these gates existed, which for a compliance product means unauditable.

  module-doc-coverage:
    name: Module Documentation Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Assert every registered module is documented
        run: |
          FAILED=0
          MODS=$(grep -oE '&[a-z]+\.Module\{\}' internal/engine/registry.go \
            | sed 's/&//;s/\.Module{}//' | sort -u)
          echo "Registered modules: $(echo ${MODS} | wc -w)"
          for mod in ${MODS}; do
            if grep -qE "^\*\*ID:\*\* \`${mod}\`" docs/MODULES.md; then
              echo "✓ ${mod}"
            else
              echo "::error file=docs/MODULES.md::Module '${mod}' is registered in internal/engine/registry.go but has no section in docs/MODULES.md"
              FAILED=1
            fi
          done
          exit ${FAILED}

  compliance-doc-coverage:
    name: Compliance Mapping Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Assert every implemented check is mapped
        run: |
          # Matches both "ID: \"ssh-001\"" literals and the string tables used by
          # the services and network modules, which build checks dynamically.
          grep -rhoE '"([a-z]{2,4}-[0-9]{3}[a-z]?)"' --include='*.go' \
            internal/modules --exclude='*_test.go' \
            | tr -d '"' | sort -u > /tmp/check_ids.txt

          TOTAL=$(wc -l < /tmp/check_ids.txt)
          echo "Implemented checks: ${TOTAL}"

          FAILED=0
          MISSING=0
          while read -r id; do
            if ! grep -q "| ${id} |" docs/COMPLIANCE.md; then
              echo "::error file=docs/COMPLIANCE.md::Check '${id}' is implemented but has no compliance mapping"
              FAILED=1
              MISSING=$((MISSING + 1))
            fi
          done < /tmp/check_ids.txt

          if [ "${FAILED}" -eq 0 ]; then
            echo "✓ all ${TOTAL} checks mapped"
          else
            echo "${MISSING} check(s) missing from docs/COMPLIANCE.md"
          fi
          exit ${FAILED}

      - name: Warn about mappings for checks that no longer exist
        run: |
          while read -r id; do
            if ! grep -rqE "\"${id}\"" --include='*.go' internal/modules --exclude='*_test.go'; then
              echo "::notice file=docs/COMPLIANCE.md::'${id}' is documented but no longer implemented"
            fi
          done < <(grep -oE '^\| [a-z]{2,4}-[0-9]{3}[a-z]? \|' docs/COMPLIANCE.md \
            | sed 's/^| //;s/ |$//' | sort -u)

  # ── Distro parity — RHEL / Rocky Linux ──────────────────────────────────────
  # Runs build + unit tests + smoke audit inside RPM-based containers to catch
  # path assumptions, syscall differences, or package-name drift that only
  # surface on non-Debian systems.
  #
  # Container limitations (documented in docs/DEVSECOPS.md):
  #   - systemd / systemctl is not available inside GitHub Actions containers.
  #     Modules that shell out to systemctl will return "inactive" gracefully;
  #     the audit is expected to complete and produce valid JSON regardless.
  #   - redhat/ubi9 is the freely available RHEL 9 Universal Base Image.
  #     It is ABI-compatible with RHEL 9 for our build/test/audit purposes.
  distro-parity:
    name: Distro Parity / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: build-and-test
    # Two extra container legs cost ~1.5 min per run. Run them when the change
    # lands on main, when a maintainer opts in with the 'full-ci' label, or on a
    # manual dispatch. main always gets the full matrix, so a distro regression
    # is caught before it can reach a release even though PRs stay fast.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # One representative per family the README claims to support. Debian and
        # Ubuntu differ enough (package names, pam defaults, sshd layout) that
        # Ubuntu-only coverage would miss Debian-specific breakage, and the same
        # is true of Rocky versus AlmaLinux.
        include:
          - distro: Rocky Linux 9
            image: rockylinux:9
            slug: rocky-linux-9
          - distro: RHEL UBI 9
            image: redhat/ubi9
            slug: rhel-ubi-9
          - distro: AlmaLinux 9
            image: almalinux:9
            slug: almalinux-9
          - distro: Debian 12
            image: debian:12
            slug: debian-12
          - distro: Amazon Linux 2023
            image: amazonlinux:2023
            slug: amazon-linux-2023
          - distro: Fedora 41
            image: fedora:41
            slug: fedora-41

    steps:
      - name: Install system dependencies
        # Detect the package manager rather than assuming dnf. This step used to
        # hardcode dnf, which is the exact defect the job exists to catch in the
        # product — the harness should not have the bug it tests for.
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends git tar gzip ca-certificates jq
          else
            dnf install -y --nodocs git tar gzip ca-certificates jq
          fi
          # Mark any directory as safe so Go's VCS stamping doesn't fail when
          # the workspace UID (runner) differs from the container UID (root).
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./... -count=1 -timeout=120s

      - name: Build hardbox binary
        run: go build -o hardbox ./cmd/hardbox

      # Deliberately no system stubs here. Earlier revisions of this job created
      # /etc/ssh/sshd_config, /etc/login.defs, /etc/rsyslog.conf and friends by
      # hand so the audit would not abort on a missing file. That validated a
      # system nobody runs. A bare container is exactly the case that must work:
      # the audit has to degrade to per-module "not applicable" findings and
      # still emit a complete report.
      - name: Smoke audit (cis-level1) on a bare container
        run: |
          ./hardbox audit --profile cis-level1 --format json \
            --output audit-${{ matrix.slug }}.json || true

      - name: Validate audit report structure
        run: |
          jq -e '
            has("session_id") and
            has("overall_score") and
            (.modules | type == "array" and length > 0) and
            all(.modules[]; has("name") and has("findings"))
          ' "audit-${{ matrix.slug }}.json" > /dev/null
          echo "✓ Audit report structure valid on ${{ matrix.distro }}"

      - name: Assert audit produced findings
        run: |
          COUNT=$(jq '[.modules[].findings[]] | length' "audit-${{ matrix.slug }}.json")
          echo "Findings on ${{ matrix.distro }}: ${COUNT}"
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::Audit returned 0 findings on ${{ matrix.distro }} — distro detection may be broken"
            exit 1
          fi

      - name: Report modules that could not be audited
        run: |
          ERRS=$(jq '[.module_errors // {} | keys[]] | length' "audit-${{ matrix.slug }}.json")
          echo "Modules not audited on ${{ matrix.distro }}: ${ERRS}"
          if [ "${ERRS}" -gt 0 ]; then
            jq -r '.module_errors | to_entries[] | "  \(.key): \(.value)"' "audit-${{ matrix.slug }}.json"
          fi
          # Informational: a bare container legitimately lacks some services.
          # The report must still exist and remain structurally valid, and no
          # single missing config may abort the whole audit.

      # Remediation is the differentiator over audit-only tools, so it needs
      # coverage on every distro, not just on the runner. Plan changes are
      # distro-sensitive: modules that install a package must pick the right
      # package manager, and a hardcoded one silently breaks four of these six
      # images.
      - name: Plan remediation (apply --dry-run)
        run: |
          ./hardbox apply --profile cis-level1 --dry-run --non-interactive \
            < /dev/null > "plan-${{ matrix.slug }}.txt" 2>&1 || true
          echo "--- head of plan ---"
          head -20 "plan-${{ matrix.slug }}.txt"

      - name: Assert the plan was built on this distro
        run: |
          if grep -qE "module [a-z]+ plan failed" "plan-${{ matrix.slug }}.txt"; then
            echo "::error::a module failed to plan on ${{ matrix.distro }}"
            grep -E "module [a-z]+ plan failed" "plan-${{ matrix.slug }}.txt"
            exit 1
          fi
          if ! grep -qE "Total: [0-9]+ change" "plan-${{ matrix.slug }}.txt"; then
            echo "::error::apply --dry-run produced no plan on ${{ matrix.distro }}"
            cat "plan-${{ matrix.slug }}.txt"
            exit 1
          fi
          echo "✓ $(grep -oE 'Total: [0-9]+ change\(s\)' "plan-${{ matrix.slug }}.txt") on ${{ matrix.distro }}"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.slug }}
          path: |
            audit-${{ matrix.slug }}.json
            plan-${{ matrix.slug }}.txt

  # Single gate job that requires all matrix legs. Add this check name to
  # branch protection if you want merges blocked until every distro passes.
  # It reports success when the matrix was intentionally skipped, so a PR that
  # did not request the full suite is not left pending forever.
  distro-parity-gate:
    name: Distro Parity Gate
    runs-on: ubuntu-latest
    needs: distro-parity
    if: always()

    steps:
      - name: Assert all parity legs passed
        run: |
          RESULT="${{ needs.distro-parity.result }}"
          case "${RESULT}" in
            success)
              echo "✓ All distro parity checks passed"
              ;;
            skipped)
              echo "✓ Distro parity not requested for this run (label: full-ci, or push to main)"
              ;;
            *)
              echo "::error::One or more distro parity checks failed (result: ${RESULT})"
              exit 1
              ;;
          esac

  goreleaser-config:
    name: Release Configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract GoReleaser release target
        id: goreleaser
        run: |
          OWNER=$(grep -A3 'release:' .goreleaser.yaml \
            | grep -A2 'github:' \
            | grep 'owner:' \
            | awk '{print $2}')
          REPO=$(grep -A3 'release:' .goreleaser.yaml \
            | grep -A2 'github:' \
            | grep 'name:' \
            | awk '{print $2}')
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "Configured release target: ${OWNER}/${REPO}"

      - name: Derive canonical owner/name from GITHUB_REPOSITORY
        id: canonical
        run: |
          CANONICAL_OWNER="${GITHUB_REPOSITORY_OWNER}"
          CANONICAL_REPO="${GITHUB_REPOSITORY#*/}"
          echo "owner=${CANONICAL_OWNER}" >> "$GITHUB_OUTPUT"
          echo "repo=${CANONICAL_REPO}" >> "$GITHUB_OUTPUT"
          echo "Canonical repository: ${CANONICAL_OWNER}/${CANONICAL_REPO}"

      - name: Assert owner matches
        run: |
          CONFIGURED="${{ steps.goreleaser.outputs.owner }}"
          CANONICAL="${{ steps.canonical.outputs.owner }}"
          if [ "${CONFIGURED}" != "${CANONICAL}" ]; then
            echo "::error file=.goreleaser.yaml::release.github.owner is '${CONFIGURED}' but canonical owner is '${CANONICAL}'. Update .goreleaser.yaml."
            exit 1
          fi
          echo "✓ owner matches: ${CONFIGURED}"

      - name: Assert repo name matches
        run: |
          CONFIGURED="${{ steps.goreleaser.outputs.repo }}"
          CANONICAL="${{ steps.canonical.outputs.repo }}"
          if [ "${CONFIGURED}" != "${CANONICAL}" ]; then
            echo "::error file=.goreleaser.yaml::release.github.name is '${CONFIGURED}' but canonical repo name is '${CANONICAL}'. Update .goreleaser.yaml."
            exit 1
          fi
          echo "✓ repo name matches: ${CONFIGURED}"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: "~> v2"

      - name: Check GoReleaser config
        run: goreleaser check --config .goreleaser.yaml
